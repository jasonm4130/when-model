<!doctype html>
<!-- The social card, 1200×630. Static on purpose: a live number in a cached card goes stale. -->
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Inter Tight';
    src: url('../../public/fonts/inter-tight.woff2') format('woff2');
    font-weight: 100 900;
  }
  @font-face {
    font-family: 'Geist Mono';
    src: url('../../public/fonts/geist-mono.woff2') format('woff2');
    font-weight: 100 900;
  }
  * {
    box-sizing: border-box;
    margin: 0;
  }
  body {
    width: 1200px;
    height: 630px;
    background: #f4f2ec;
    font-family: 'Inter Tight', sans-serif;
    color: #111;
    font-feature-settings: 'tnum' 0;
  }
  .strip {
    height: 76px;
    background: #fccc0a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 64px;
  }
  .strip b {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .strip span {
    font-size: 21px;
    font-weight: 500;
  }
  .sign {
    height: 554px;
    background: #141414;
    color: #fff;
    padding: 0 64px;
    position: relative;
  }
  .sign::before {
    content: '';
    position: absolute;
    left: 64px;
    right: 64px;
    top: 28px;
    height: 3px;
    background: #fff;
  }
  .label {
    padding-top: 64px;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #b8b8b8;
    text-transform: uppercase;
  }
  h1 {
    margin-top: 16px;
    font-size: 150px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -0.035em;
  }
  p {
    margin-top: 24px;
    font-size: 32px;
    line-height: 40px;
    color: #fff;
    max-width: 860px;
  }
  .foot {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .lines {
    display: flex;
    gap: 10px;
  }
  .b {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 25px;
    font-weight: 700;
  }
  .plate {
    font-family: 'Geist Mono', monospace;
    font-size: 18px;
    letter-spacing: 0.04em;
    border: 2px solid #fff;
    padding: 9px 14px;
  }
  .plate i {
    font-style: normal;
    color: #b8b8b8;
  }
</style>
<div class="strip"><b>whenmodel.com</b><span>Service status from live prediction markets</span></div>
<div class="sign">
  <div class="label">Next model departing</div>
  <h1>whenmodel</h1>
  <p>Which frontier AI lab ships next, and when: one line per lab, timed by Polymarket.</p>
  <div class="foot">
    <div class="lines" id="lines"></div>
    <div class="plate">NOT A FORECAST <i>· crowd estimates</i></div>
  </div>
</div>
<script type="module">
  // The bullets come from the site's own line map, so the card never disagrees with the pages.
  const bullets = JSON.parse(new URLSearchParams(location.search).get('bullets') || '[]');
  document.getElementById('lines').innerHTML = bullets
    // A bullet as dark as the sign (xAI's) gets a white ring so it stays a disc.
    .map(
      (b) =>
        `<span class="b" style="background:${b.fill};color:${b.ink}${b.fill === '#141414' ? ';box-shadow:inset 0 0 0 2px #fff' : ''}">${b.letter}</span>`,
    )
    .join('');
</script>
